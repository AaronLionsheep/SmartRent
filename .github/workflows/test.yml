name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version up: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r "SmartRent.indigoPlugin/Contents/Server Plugin/requirements.txt"
