name: Add Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build plugin artifact
        run: zip -r SmartRent.indigoPlugin.zip SmartRent.indigoPlugin

      - name: Upload Release Asset
        run: gh release upload ${{ github.ref_name }} SmartRent.indigoPlugin.zip
        env:
            GH_TOKEN: ${{ github.token }}