# Ruff configuration: https://docs.astral.sh/ruff/configuration/
target-version = "py311"
line-length = 120

[lint]
# Pyflakes (F), the pycodestyle errors (E4, E7, E9) that don't overlap with the formatter, and isort (I).
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
combine-as-imports = true
